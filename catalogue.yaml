- name: configure catalogue
  hosts: catalogue
  become: yes
  tasks:
  - name: disable nodejs module
    ansible.builtin.command: " dnf module disable nodejs -y "

  - name: enable nodejs module
    ansible.builtin.command: " dnf module enable nodejs:20 -y "

  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present
  - name: create system user
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      home: /app
      system: true
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: Download the application code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip  
      dest: /tmp/catalogue.zip
# remote_src=yes to unpack an archive which already exists on the target.
  - name: unzip the application code 
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
  - name: Install dependencies  for nodejs
    community.general.npm:
      path: /app
  - name: copy catalogue service 
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service

  - name: daemon reload catalogue service
    ansible.builtin.systemd_service:
      daemon_reload: true
  - name: enable and start catalogue service
    ansible.builtin.service:
      name: catalogue
      state: started
      enabled: yes
  - name: copy mongo repo 
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb client 
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

  - name: load data into mongodb  
    ansible.builtin.command: mongosh --host mongodb.devops26.sbs --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: shell_ouput

  - name: print shell shell_ouput
    ansible.builtin.debug:
      msg: "{{ shell_ouput }}"
  
  - name: load test data 
    ansible.builtin.shell: mongosh --host mongodb.devops26.sbs < /app/db/master-data.js
    when: shell_ouput.stdout | int < 0

  - name: restart catalogue
    ansible.builtin.service:
      name: catalogue
      state: restarted
       

      
  
    