- name: configure user
  hosts: user
  become: yes
  tasks:
  - name: disable nodejs module
    ansible.builtin.command: " dnf disable module nodejs -y"
  - name: enable nodejs module
    ansible.builtin.command: " dnf enable module nodejs:20 -y"
  - name: install  nodejs 
    ansible.builtin.dnf:
      name: nodejs
      state: present
  