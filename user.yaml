- name: configure user
  hosts: user
  become: yes
  tasks:
  - name: disable nodejs module
    ansible.builtin.command: "dnf module disable nodejs -y"
  - name: enable nodejs module
    ansible.builtin.command: "dnf module enable nodejs:20 -y"
  - name: install  nodejs 
    ansible.builtin.dnf:
      name: nodejs
      state: present
  - name: crete system user 
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      home: /app
      system: true # system user creation

  - name: create /app directory
    tags:
    - import
    ansible.builtin.file:
      path: /app
      state: directory

      