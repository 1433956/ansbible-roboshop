- name: configure cart
  hosts: cart
  become: yes
  tasks:
  - name: disable nodejs module
    ansible.builtin.command: "dnf module disable nodejs -y"
  - name: enable nodejs module
    ansible.builtin.command: "dnf module enable nodejs:20 -y"
  - name: install  nodejs 
    ansible.builtin.dnf:
      name: nodejs
      state: present
  - name: crete system user 
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      home: /app
      system: true # system user creation

  - name: create /app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: download application code for cart
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip
  
  - name: unzip application code for cart
    ansible.builtin.unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: true
  
  - name: install nodejs dependencies
    community.general.npm:
      path: /app
  
  - name: copy cart service file
    ansible.builtin.copy:
      src: cart.service
      dest: /etc/systemd/system/cart.service

  - name: daemon_reload service
    ansible.builtin.systemd:
      daemon_reload: true

  - name: enable and start cart service
    ansible.builtin.service:
      name: cart
      state: started
      enabled: yes


      