- name: configure shipping 
  hosts: shipping
  become: yes
  tasks:
  - name: install maven and mysql 
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
    - maven
    - mysql
  - name: create system user 
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      home: /app
      system: true

  - name: create app directory
    ansible.builtin.file:
      name: /app
      state: directory

  - name: download code for shipping
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip 
      dest: /tmp/shipping.zip

  - name: unzip the shipping code 
    ansible.builtin.unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes

  - name: install maven  dependencies
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: rename shipping jar file
    ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar 
    args:
      chdir: /app
  
  - name: copy shipping service file 
    ansible.builtin.copy:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service

  - name: daemon_reload service
    ansible.builtin.systemd_service:
      daemon_reload: true 

  - name: enable  and start shipping service
    ansible.builtin.service:
      name: shipping
      state: started
      enabled: yes

  - name: import data
    community.mysql.mysql_db:
      name: all
      state: import
      target: "{{ item }}"
      login_host: mysql.devops26.sbs
      login_user: root
      login_password: RoboShop@1
    loop: 
    - /app/db/schema.sql
    - /app/db/app-user.sql 
    - /app/db/master-data.sql
  
  
  
   
  
      